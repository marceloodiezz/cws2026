# TINVOICES
#TINVOICES_SELECT_LAST_NUMBER = SELECT MAX(number) FROM TInvoices
#TINVOICES_INSERT = INSERT INTO TInvoices \
#                   (id, number, date, vat, amount, state, version, \
#                   createdAt, updatedAt, entityState) \
#                   VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TINVOICES_FINDNEXTNUMBER = select max(number) \
                           from TInvoices
TINVOICES_ADD = insert into TInvoices \
                (id, version, number, date, state, subtotal, total, \
                vatRate, vatAmount, createdAt, updatedAt, entityState) \
                values (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

# TMECHANICS
TMECHANICS_ADD = insert into TMechanics(id, nif, name, surname, version, \
                 createdAt, updatedAt, entityState) \
                 values (?, ?, ?, ?, ?, ?, ?, ?)
TMECHANICS_DELETE = delete from TMechanics where id = ?
TMECHANICS_FINDBYID = select id, nif, name, surname, version, \
                      createdAt, updatedAt, entityState \
                      from TMechanics \
                      where id = ?
TMECHANICS_FINDBYNIF = select id, nif, name, surname, version, \
                       createdAt, updatedAt, entityState \
                       from TMechanics \
                       where nif = ?
TMECHANICS_FINDALL = select id, nif, name, surname, version, \
                     createdAt, updatedAt, entityState \
                     from TMechanics
TMECHANICS_UPDATE = update TMechanics \
                    set name = ?, surname = ?, nif = ?, \
                    version = version + 1, updatedat = ? \
                    where id = ?

