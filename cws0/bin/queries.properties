TWORKORDERS_COUNT_BY_MECHANIC = select count(*) \
                                from TWorkOrders \
                                where mechanic_id = ?
TWORKORDERS_FINDAMOUNT = select total_amount \
                         from TWorkOrders \
                         where id = ?
TWORKORDERS_FINDID = select id \
                     from TWorkOrders \
                     where id = ?
TWORKORDERS_FINDSTATE = select state \
                        from TWorkOrders \
                        where id = ?
TWORKORDERS_UPDATEINVOICEID = update TWorkOrders \
                              set invoice_id = ? \
                              where id = ?
TWORKORDERS_UPDATESTATE = update TWorkOrders \
                          set state = 'INVOICED' \
                          where id = ?
TWORKORDERS_UPDATEVERSION = update TWorkOrders \
                            set version = version + 1 \
                            where id = ?
TWORKORDERS_UPDATETIMESTAMP = update TWorkOrders \
                              set updatedAt = ? \
                              where id = ?

