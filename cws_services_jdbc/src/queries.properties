# TINVOICES
TINVOICES_FINDNEXTNUMBER = select max(number) \
                           from TInvoices
TINVOICES_ADD = insert into TInvoices \
                (id, version, number, date, state, subtotal, total, \
                vatRate, vatAmount, createdAt, updatedAt, entityState, \
                usedForVoucher) \
                values (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

# TMECHANICS
TMECHANICS_ADD = insert into TMechanics(id, nif, name, surname, version, \
                 createdAt, updatedAt, entityState) \
                 values (?, ?, ?, ?, ?, ?, ?, ?)
TMECHANICS_DELETE = delete from TMechanics where id = ?
TMECHANICS_FINDBYID = select id, nif, name, surname, version, \
                      createdAt, updatedAt, entityState \
                      from TMechanics \
                      where id = ?
TMECHANICS_FINDBYNIF = select id, nif, name, surname, version, \
                       createdAt, updatedAt, entityState \
                       from TMechanics \
                       where nif = ?
TMECHANICS_FINDALL = select id, nif, name, surname, version, \
                     createdAt, updatedAt, entityState \
                     from TMechanics
TMECHANICS_UPDATE = update TMechanics \
                    set name = ?, surname = ?, nif = ?, \
                    version = version + 1, updatedat = ? \
                    where id = ?

# TWORKORDERS
TWORKORDERS_FINDBYID = select id, version, createdAt, updatedAt, entityState, \
                       date, description, total_amount, state, \
                       invoice_id, mechanic_id, vehicle_id \
                       from TWorkOrders \
                       where id = ?
TWORKORDERS_UPDATE = update TWorkOrders \
                     set invoice_id = ?, state = ?, \
                     version = version + 1, updatedAt = ? \
                     where id = ?
TWORKORDERS_COUNT_BY_MECHANIC = select count(*) \
                                from TWorkOrders \
                                where mechanic_id = ?
TWORKORDERS_FIND_NOT_INVOICED = select a.id, a.description, a.date, a.state, \
                                a.total_amount \
                                from TWorkOrders as a, TVehicles as v, \
                                TClients as c \
                                where a.vehicle_id = v.id \
                                and v.client_id = c.id \
                                and state like 'APPROVED' \
                                and nif like ?

# TINTERVENTIONS
TINTERVENTIONS_COUNT_BY_MECHANIC = select count(*) \
                                   from TInterventions \
                                   where mechanic_id = ?