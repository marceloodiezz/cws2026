# -- TCHARGES -----------------------------------------------------------------------

TCHARGES_ADD = insert into TCharges \
               (id, charge, invoice_id, paymentMean_id, \
               version, createdAt, updatedAt, entityState) \
               values (?, ?, ?, ?, ?, ?, ?, ?)

TCHARGES_COUNTBYPAYMENTMEANID = select count(*) \
                                from TCharges \
                                where paymentMean_id = ?

TCHARGES_FINDALL = select id, charge, invoice_id, \
                   paymentMean_id, version, createdAt, \
                   updatedAt, entityState \
                   from TCharges

TCHARGES_FINDBYID = select id, charge, invoice_id, \
                    paymentMean_id, version, createdAt, \
                    updatedAt, entityState \
                    from TCharges \
                    where id = ?

TCHARGES_REMOVE = delete from TCharges \
                  where id = ?

TCHARGES_UPDATE = update TCharges \
                  set charge = ?, invoice_id = ?, \
                  paymentMean_id = ?, \
                  version = version + 1, updatedAt = ?, \
                  entityState = ? \
                  where id = ?


