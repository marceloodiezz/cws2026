# -- TWORKORDERS --------------------------------------------------------------------

TWORKORDERS_FINDBYID = select id, version, createdAt, updatedAt, entityState, \
                       date, description, total_amount, state, \
                       invoice_id, mechanic_id, vehicle_id \
                       from TWorkOrders \
                       where id = ?

TWORKORDERS_FINDNOTINVOICEDBYCLIENTNIF = select a.id, a.description, a.date, a.state, \
                                         a.total_amount \
                                         from TWorkOrders as a, TVehicles as v, \
                                         TClients as c \
                                         where a.vehicle_id = v.id \
                                         and v.client_id = c.id \
                                         and state like 'APPROVED' \
                                         and nif like ?

TWORKORDERS_HASPAIDWORKORDERSBYCLIENTID = select count(*) \
                                          from TWorkOrders as wo \
                                          join TVehicles as v \
                                          on wo.vehicle_id = v.id \
                                          join TInvoices as i \
                                          on wo.invoice_id = i.id \
                                          where v.client_id = ? \
                                          and i.state = 'PAID'

TWORKORDERS_HASWORKORDERS = select count(*) \
                            from TWorkOrders \
                            where mechanic_id = ?

TWORKORDERS_UPDATE = update TWorkOrders \
                     set invoice_id = ?, state = ?, \
                     version = version + 1, updatedAt = ? \
                     where id = ?